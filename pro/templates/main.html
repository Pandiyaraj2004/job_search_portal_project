<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Welcome</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-image: url('static/images/pexels.jpg'); /* Replace with a relevant background image */
            background-size: cover;
            background-position: center;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
            
        }
        .container {
            background-color: rgba(0, 0, 0, 0.7);
            padding: 40px;
            border-radius: 10px;
            text-align: center;
            color: rgb(255, 255, 255);
            box-shadow: 0 4px 8px rgba(22, 22, 22, 0.3);
            width: 500px;
        }
        h1 {
            font-size: 28px;
            margin-bottom: 20px;
        }
        button {
            background-color: #007bff;
            color: white;
            padding: 12px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background-color: #0056b3;
        }
        button:active {
            transform: scale(0.98);
        }
        /* Slider styles */
        .slider {
            margin: 20px 0;
            overflow: hidden;
            border-radius: 10px;
        }
        .slider img {
            width: 100%;
            animation: slide 12s infinite;
        }
        @keyframes slide {
            0% { transform: translateX(0); }
            25% { transform: translateX(-100%); }
            50% { transform: translateX(-200%); }
            75% { transform: translateX(-300%); }
            100% { transform: translateX(0); }
        }
        .slider-container {
            display: flex;
            width: 300%; /* Four images, adjust for more */
        }
        .slider-container img {
            width: 25%; /* Each image takes 25% of the container's width */
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Welcome, {{ username }}!</h1>
        <p>We're excited to have you here. Click the button below to get started!</p>
        <form action="/get_started" method="POST">
            <button type="submit">Get Started</button>
        </form>

        <!-- Image Slider -->
        <div class="slider">
            <div class="slider-container">
                <img src="https://img.freepik.com/premium-vector/business-people-top-mountain-with-megaphone_18591-3715.jpg?ga=GA1.1.923300119.1732805923&semt=ais_hybrid" alt="Image 1"> <!-- Replace with actual image URLs -->
                <img src="https://img.freepik.com/premium-vector/businessman-climb-success-ladder_8140-314.jpg?ga=GA1.1.923300119.1732805923&semt=ais_hybrid" alt="Image 2">
                <img src="https://img.freepik.com/premium-vector/businessman-vision-concept_8140-313.jpg?ga=GA1.1.923300119.1732805923&semt=ais_hybrid" alt="Image 3">
                <img src="https://img.freepik.com/premium-vector/executive-group-running-gears-businessman-with-megaphone_18591-3709.jpg?ga=GA1.1.923300119.1732805923&semt=ais_hybrid" alt="Image 4">
            </div>
        </div>
    </div>
</body>
</html>
